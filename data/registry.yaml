      model_version: claude-3-sonnet-20240229
    gemini:
      path: llm_responses/gemini_pro_responses.jsonl
      model_version: gemini-1.5-pro

  results:
    hallucination_rates: results/hallucination_rates.csv
    model_comparison: results/model_comparison.csv
    bias_metrics: results/bias_metrics.csv
