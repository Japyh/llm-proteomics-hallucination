    description: Expert-adjudicated hallucination labels
    schema: schemas/annotation_schema.json
    
  llm_responses:
    gpt4:
      path: llm_responses/gpt4_turbo_responses.jsonl
      model_version: gpt-4-turbo-2024-04-09
