name: Build Paper
permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'paper/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'paper/**'
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install matplotlib numpy seaborn

    - name: Generate figures
      run: |
        cd paper/figures
        python generate_all_figures.py

    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-fonts-recommended \
          texlive-bibtex-extra \
          biber

    - name: Compile paper
      run: |
        cd paper
        pdflatex -interaction=nonstopmode main.tex || true
        bibtex main || true
        pdflatex -interaction=nonstopmode main.tex || true
        pdflatex -interaction=nonstopmode main.tex || true

    - name: Check PDF output
      run: |
        if [ -f paper/main.pdf ]; then
          echo "PDF generated successfully"
          ls -lh paper/main.pdf
        else
          echo "PDF generation failed"
          exit 1
        fi

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: paper-pdf
        path: paper/main.pdf

    - name: Upload figures
      uses: actions/upload-artifact@v4
      with:
        name: figures
        path: paper/figures/output/
