name: Lint
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy pylint bandit

      - name: Check code formatting with Black
        run: |
          black --check src/ tests/ scripts/

      - name: Check import sorting with isort
        run: |
          isort --check-only --profile black src/ tests/ scripts/

      - name: Lint with flake8
        run: |
          flake8 src/ tests/ scripts/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Type checking with mypy
        run: |
          mypy src/ --ignore-missing-imports
        continue-on-error: true

      - name: Security check with bandit
        run: |
          bandit -r src/ -ll
        continue-on-error: true

      - name: Lint with pylint
        run: |
          pylint src/ --max-line-length=100 --disable=C0114,C0115,C0116
        continue-on-error: true

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: '**/*.md'
          ignore: node_modules
        continue-on-error: true

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: configs/ .github/workflows/ data/registry.yaml
          config_file: .yamllint.yml
        continue-on-error: true
