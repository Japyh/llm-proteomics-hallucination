[metadata]
name = llm-proteomics-hallucination
version = 1.0.0
description = Evaluation of hallucinations in LLM responses to proteomics queries
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/olaflaitinen/llm-proteomics-hallucination
author = Olaf Yunus Laitinen Imanov
author_email = olyulaim@dtu.dk
license = CC-BY-4.0
license_files = LICENSE
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    License :: OSI Approved :: Creative Commons Attribution 4.0 International (CC BY 4.0)
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Bio-Informatics
    Topic :: Scientific/Engineering :: Artificial Intelligence
project_urls =
    Bug Reports = https://github.com/olaflaitinen/llm-proteomics-hallucination/issues
    Source = https://github.com/olaflaitinen/llm-proteomics-hallucination
    Documentation = https://github.com/olaflaitinen/llm-proteomics-hallucination/blob/main/README.md
    Preregistration = https://osf.io/x7mk9
    Zenodo = https://doi.org/10.5281/zenodo.11234567

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
install_requires =
    numpy>=1.24.0
    pandas>=2.0.0
    scipy>=1.10.0
    scikit-learn>=1.3.0
    matplotlib>=3.7.0
    seaborn>=0.12.0
    openai>=1.0.0
    anthropic>=0.18.0
    google-generativeai>=0.3.0
    pydantic>=2.0.0
    jsonschema>=4.17.0
    pyyaml>=6.0
    requests>=2.31.0
    tqdm>=4.65.0

[options.packages.find]
where = src

[options.extras_require]
dev =
    pytest>=7.3.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.0
    black>=23.3.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.3.0
    pylint>=2.17.0
    bandit>=1.7.5
analysis =
    statsmodels>=0.14.0
    pingouin>=0.5.3
    scikit-posthocs>=0.7.0
ml =
    mlflow>=2.3.0
    wandb>=0.15.0
    optuna>=3.2.0
notebooks =
    jupyter>=1.0.0
    jupyterlab>=4.0.0
    ipywidgets>=8.0.0
    nbconvert>=7.5.0
all =
    %(dev)s
    %(analysis)s
    %(ml)s
    %(notebooks)s

[flake8]
max-line-length = 100
extend-ignore = E203, W503, E402
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    venv,
    env,
    .mypy_cache,
    .pytest_cache

[isort]
profile = black
line_length = 100
skip_gitignore = True
known_first_party = src
known_third_party = numpy,pandas,scipy,sklearn,matplotlib,seaborn

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_api: marks tests that require API access
    requires_docker: marks tests that require Docker

[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
