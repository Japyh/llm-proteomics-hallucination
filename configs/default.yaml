# Default configuration for LLM Proteomics Hallucination Study

project:
  name: "llm-proteomics-hallucination"
  version: "1.0.0"
  description: "Hallucination risks of LLMs in clinical proteomics"
  
paths:
  data_dir: "data"
  results_dir: "data/results"
  figures_dir: "paper/figures/output"
  models_cache: ".cache/models"

random_seed: 42

evaluation:
  test_size: 0.2
  validation_size: 0.1
  n_bootstrap: 1000
  confidence_level: 0.95

analysis:
  bonferroni_correction: true
  significance_threshold: 0.05
  effect_size_method: "cohen_d"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/llm_proteomics.log"
