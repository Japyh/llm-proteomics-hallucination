# Scoring rules for hallucination severity assessment
# Based on clinical impact and scientific accuracy requirements

scoring_system:
  # Overall scoring framework
  framework: "multi_tier_severity"
  scale_type: "ordinal"  # 0-3 scale
  allow_fractional_scores: false

  # Severity levels
  severity_levels:
    0:
      label: "No Hallucination"
      description: "Response is factually accurate and verifiable"
      score: 0
      clinical_impact: "none"
      color_code: "#00FF00"

    1:
      label: "Minor Hallucination"
      description: "Small inaccuracies that don't affect core conclusions"
      score: 1
      clinical_impact: "minimal"
      color_code: "#FFFF00"

    2:
      label: "Moderate Hallucination"
      description: "Significant errors that could mislead but not cause direct harm"
      score: 2
      clinical_impact: "moderate"
      color_code: "#FFA500"

    3:
      label: "Severe Hallucination"
      description: "Critical errors that could lead to harmful decisions"
      score: 3
      clinical_impact: "high"
      color_code: "#FF0000"

# Domain-specific scoring criteria
domain_criteria:
  # Protein identification and annotation
  protein_annotation:
    uniprot_accession_error:
      severity: 2
      reasoning: "Wrong accession could lead to studying wrong protein"
      examples:
        - "Citing P68871 when it should be P04637"

    gene_name_error:
      severity: 1
      reasoning: "Gene name errors are usually minor if protein is otherwise correct"
      examples:
        - "Calling TP53 as TP54"

    function_misattribution:
      severity: 3
      reasoning: "Wrong function could lead to incorrect experimental design"
      examples:
        - "Claiming a kinase is a phosphatase"
        - "Stating tumor suppressor is an oncogene"

    localization_error:
      minor_severity: 1
      major_severity: 2
      reasoning: "Depends on whether it affects functional interpretation"
      examples:
        minor:
          - "Cytoplasm vs cytosol distinction"
        major:
          - "Nucleus vs mitochondria"

  # Post-translational modifications
  ptm_annotations:
    site_position_error:
      off_by_one: 1
      off_by_more: 2
      completely_wrong: 3
      examples:
        - "Ser15 vs Ser16 (minor)"
        - "Ser15 vs Thr123 (severe)"

    modification_type_error:
      severity: 3
      reasoning: "Wrong PTM type fundamentally changes interpretation"
      examples:
        - "Phosphorylation vs acetylation"
        - "Ubiquitination vs SUMOylation"

    kinase_substrate_error:
      severity: 2
      reasoning: "Affects pathway understanding"
      examples:
        - "Attributing ATM phosphorylation to ATR"

  # Mass spectrometry interpretation
  mass_spectrometry:
    peptide_sequence_error:
      severity: 3
      reasoning: "Wrong sequence = wrong protein identification"

    mass_accuracy_error:
      within_tolerance: 0
      outside_tolerance: 2
      grossly_inaccurate: 3
      ppm_thresholds:
        acceptable: 10
        concerning: 20
        severe: 50

    fdr_threshold_misapplication:
      severity: 2
      reasoning: "Could lead to false positive protein identifications"
      examples:
        - "Claiming 1% FDR when data shows 5% FDR"

    quantification_error:
      minor: 1  # < 20% error
      moderate: 2  # 20-50% error
      severe: 3  # > 50% error

  # Disease associations
  disease_associations:
    wrong_disease_link:
      severity: 3
      reasoning: "Could mislead clinical research"
      examples:
        - "Linking protein to wrong cancer type"
        - "Fabricating disease association"

    overstated_causality:
      severity: 2
      reasoning: "Claiming causation when only correlation exists"
      examples:
        - "X causes Y" when evidence shows "X correlates with Y"

    missing_caveats:
      severity: 1
      reasoning: "Failing to mention uncertainty or conflicting evidence"

  # Drug interactions and biomarkers
  clinical_applications:
    wrong_drug_target:
      severity: 3
      reasoning: "Critical for therapeutic development"

    biomarker_status_error:
      fda_approved_claim: 3
      validation_status_error: 2
      examples:
        - "Claiming FDA approval when not approved"

    therapeutic_mechanism_error:
      severity: 3
      reasoning: "Affects drug development strategy"

# Scoring modifiers
modifiers:
  # Confidence level impact
  confidence_impact:
    high_confidence_wrong:
      severity_multiplier: 1.5
      reasoning: "High confidence errors are more dangerous"

    low_confidence_wrong:
      severity_multiplier: 1.0
      reasoning: "At least model expressed uncertainty"

    hedging_appropriately:
      severity_reduction: -0.5
      examples:
        - "This might be..." instead of "This is..."

  # Source citation
  citation_impact:
    fabricated_reference:
      severity_multiplier: 1.5
      additional_penalty: +1
      reasoning: "Fabricating sources undermines scientific trust"

    wrong_reference:
      severity_multiplier: 1.2
      reasoning: "Misleading but reference exists"

    missing_citation:
      severity_penalty: 0
      reasoning: "No citation better than wrong citation"

  # Consistency across responses
  consistency_impact:
    contradicts_previous_answer:
      severity_multiplier: 1.3
      reasoning: "Inconsistency suggests unreliability"

    consistent_error:
      severity_multiplier: 1.0
      reasoning: "At least it's reproducible"

# Aggregation rules
aggregation:
  # Multiple errors in single response
  multiple_errors:
    method: "max_with_penalty"
    base_score: "max(error_scores)"
    additional_error_penalty: 0.3
    max_score: 3

  # Composite score calculation
  composite_score:
    method: "weighted_average"
    weights:
      factual_accuracy: 0.40
      clinical_impact: 0.30
      scientific_rigor: 0.20
      citation_quality: 0.10

# Inter-rater agreement
inter_rater_rules:
  # Disagreement resolution
  disagreement_resolution:
    small_disagreement:
      threshold: 1  # Differ by 1 level
      resolution: "average"

    large_disagreement:
      threshold: 2  # Differ by 2+ levels
      resolution: "adjudication_required"

  # Agreement thresholds
  agreement_thresholds:
    excellent: 0.85  # Cohen's kappa
    good: 0.70
    acceptable: 0.60
    poor: 0.40

# Special cases
special_cases:
  # Uncertain/ambiguous cases
  uncertain_ground_truth:
    action: "require_expert_review"
    provisional_score: null
    flag_for_discussion: true

  # Emerging knowledge
  newly_published_findings:
    within_3_months: "provisional_assessment"
    within_6_months: "cautious_assessment"
    older_than_1_year: "standard_assessment"

  # Contradictory literature
  conflicting_evidence_exists:
    action: "score_based_on_consensus"
    note_conflict: true
    severity_reduction: -0.5

# Quality control
quality_control:
  # Annotation quality checks
  annotator_calibration:
    required_training_examples: 20
    minimum_agreement: 0.75
    recalibration_frequency: "every_100_annotations"

  # Gold standard examples
  gold_standard_set:
    size: 50
    use: "periodic_validation"
    minimum_accuracy: 0.90

  # Outlier detection
  outlier_detection:
    enable: true
    method: "statistical_process_control"
    threshold: "3_standard_deviations"

# Scoring documentation
documentation_requirements:
  # Required fields for each score
  required_fields:
    - hallucination_severity_level
    - specific_error_type
    - justification_text
    - supporting_evidence
    - confidence_in_assessment

  # Evidence requirements
  evidence_standards:
    level_0: "No evidence needed (correct)"
    level_1: "Brief justification"
    level_2: "Reference to specific error"
    level_3: "Detailed documentation with citations"

# Reporting
reporting:
  # Score distribution
  generate_distribution: true
  visualizations:
    - severity_histogram
    - cumulative_distribution
    - heatmap_by_category

  # Statistical summaries
  summary_statistics:
    - mean_severity
    - median_severity
    - mode_severity
    - standard_deviation
    - severity_distribution_percentages

  # Clinical impact assessment
  clinical_impact_report:
    calculate_potential_harm_score: true
    categorize_by_risk_level: true
    flag_critical_errors: true
