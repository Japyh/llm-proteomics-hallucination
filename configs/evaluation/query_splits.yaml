# Query splits configuration for train/validation/test sets
# Ensures proper stratification and no data leakage in LLM evaluation

dataset_splits:
  # Overall split ratios
  split_ratios:
    train: 0.60
    validation: 0.20
    test: 0.20

  # Random seed for reproducibility
  random_seed: 42
  shuffle: true

  # Stratification variables
  stratification:
    enable: true
    variables:
      - complexity_level
      - protein_prevalence
      - hallucination_expected_difficulty

    # Ensure balanced representation
    min_samples_per_stratum: 10
    stratification_method: "proportional"  # Options: proportional, balanced

# Query complexity stratification
complexity_stratification:
  low_complexity:
    criteria:
      - token_count_max: 50
      - multi_hop_reasoning: false
      - integration_required: false
    target_proportion: 0.33
    min_samples:
      train: 60
      validation: 20
      test: 20

  medium_complexity:
    criteria:
      - token_count_range: [50, 150]
      - multi_hop_reasoning: true
      - max_integration_sources: 3
    target_proportion: 0.34
    min_samples:
      train: 60
      validation: 20
      test: 20

  high_complexity:
    criteria:
      - token_count_min: 150
      - multi_hop_reasoning: true
      - integration_required: true
      - reasoning_depth: "deep"
    target_proportion: 0.33
    min_samples:
      train: 60
      validation: 20
      test: 20

# Protein prevalence stratification
protein_prevalence_stratification:
  common:
    uniprot_citations: ">1000"
    pubmed_mentions: ">500"
    target_proportion: 0.40
    examples: ["TP53", "EGFR", "AKT1", "HBB"]

  uncommon:
    uniprot_citations: "100-1000"
    pubmed_mentions: "50-500"
    target_proportion: 0.35
    examples: ["MYH7", "MYBPC3", "PSEN1"]

  rare:
    uniprot_citations: "<100"
    pubmed_mentions: "<50"
    target_proportion: 0.25
    examples: ["Novel proteins", "Orphan proteins"]

# Temporal split (for temporal generalization evaluation)
temporal_splits:
  enable: false  # Enable for temporal analysis
  split_by_date: false
  cutoff_dates:
    train_end: "2023-01-01"
    validation_end: "2023-07-01"
    test_start: "2023-07-01"

# Cross-validation configuration
cross_validation:
  enable: true
  method: "stratified_k_fold"
  n_folds: 5
  shuffle: true
  random_seed: 42

  # Nested cross-validation for hyperparameter tuning
  nested_cv:
    enable: true
    inner_folds: 3
    outer_folds: 5

# Data leakage prevention
leakage_prevention:
  # Protein-level splitting (prevent same protein in train/test)
  protein_level_split: true
  protein_family_aware: true

  # Sequence similarity checks
  sequence_similarity_threshold: 0.9
  check_homologs: true

  # Query paraphrase detection
  paraphrase_detection:
    enable: true
    similarity_threshold: 0.85
    method: "sentence_transformers"

# Special evaluation sets
special_sets:
  # Adversarial examples
  adversarial_set:
    enable: true
    size: 50
    sources:
      - expert_crafted_edge_cases
      - known_model_failure_modes
      - synthetic_challenging_queries

  # Out-of-distribution (OOD) set
  ood_set:
    enable: true
    size: 100
    characteristics:
      - unseen_protein_families
      - novel_modifications
      - emerging_diseases
      - cross_species_rare_proteins

  # Calibration set
  calibration_set:
    enable: true
    size: 200
    use_from: "validation"
    purpose: "temperature_scaling"

  # Human baseline comparison set
  human_baseline_set:
    enable: true
    size: 100
    annotators_per_query: 2
    use_from: "test"

# Domain-specific splits
domain_splits:
  # By biological process
  by_biological_process:
    apoptosis: 0.15
    metabolism: 0.20
    signal_transduction: 0.25
    protein_synthesis: 0.15
    cell_cycle: 0.15
    immune_response: 0.10

  # By experimental technique
  by_technique:
    mass_spectrometry: 0.50
    western_blot: 0.15
    immunofluorescence: 0.10
    proteomics_array: 0.15
    computational_prediction: 0.10

  # By disease category
  by_disease:
    cancer: 0.35
    neurodegenerative: 0.20
    cardiovascular: 0.15
    metabolic: 0.15
    infectious_disease: 0.10
    rare_disease: 0.05

# Quality control for splits
quality_control:
  # Statistical tests for split balance
  balance_tests:
    - chi_square_test:
        significance_level: 0.05
        variables: ["complexity", "prevalence"]

    - ks_test:
        significance_level: 0.05
        variables: ["token_count", "difficulty_score"]

  # Distribution similarity checks
  distribution_checks:
    enable: true
    methods:
      - kolmogorov_smirnov
      - wasserstein_distance
      - jensen_shannon_divergence

    acceptable_thresholds:
      ks_statistic: 0.10
      wasserstein_distance: 0.15
      js_divergence: 0.08

  # Class imbalance checks
  imbalance_checks:
    max_class_ratio: 3.0  # No class should be >3x another
    min_class_samples: 10

# Data augmentation (for training only)
data_augmentation:
  enable: true
  apply_to: "train"
  methods:
    - paraphrasing:
        enable: true
        num_variations: 2
        model: "t5-base"

    - back_translation:
        enable: true
        languages: ["de", "fr"]
        round_trip: true

    - entity_substitution:
        enable: true
        substitute_proteins: true
        maintain_protein_properties: true

    - synthetic_generation:
        enable: true
        generator_model: "llama3-70b"
        num_synthetic: 100

# Holdout sets for final evaluation
holdout_sets:
  # Independent test set (never seen during development)
  independent_test:
    enable: true
    size: 100
    source: "expert_curated"
    lock_until: "final_evaluation"

  # Clinical validation set
  clinical_validation:
    enable: true
    size: 50
    source: "real_clinical_queries"
    require_expert_validation: true

# Metadata tracking
metadata:
  track_split_assignments: true
  save_split_indices: true
  export_format: "json"
  output_path: "data/splits/"

  include_metadata:
    - query_id
    - split_assignment
    - stratification_group
    - complexity_score
    - protein_prevalence_category
    - creation_timestamp

# Versioning
versioning:
  enable: true
  version_format: "v{major}.{minor}.{patch}"
  current_version: "v1.0.0"
  track_changes: true
  changelog_path: "data/splits/CHANGELOG.md"
