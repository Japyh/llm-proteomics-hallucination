# Logging configuration for LLM Proteomics Hallucination Evaluation
# Compatible with Python logging.config.dictConfig()

version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

  detailed:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(funcName)s() - %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S.%f'

  json:
    class: pythonjsonlogger.jsonlogger.JsonFormatter
    format: '%(asctime)s %(name)s %(levelname)s %(filename)s %(lineno)d %(message)s'

  research:
    format: '[%(asctime)s] [%(experiment_id)s] [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

filters:
  experiment_filter:
    (): src.utils.logging_filters.ExperimentContextFilter

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout

  console_detailed:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout

  file_general:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/application.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  file_errors:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 10
    encoding: utf-8

  file_experiments:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: research
    filename: logs/experiments.log
    when: midnight
    interval: 1
    backupCount: 30
    encoding: utf-8
    filters: [experiment_filter]

  file_llm_api:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/llm_api_calls.log
    maxBytes: 52428800  # 50MB
    backupCount: 20
    encoding: utf-8

  file_hallucination_detection:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/hallucination_detection.log
    maxBytes: 20971520  # 20MB
    backupCount: 10
    encoding: utf-8

  file_statistical_analysis:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/statistical_analysis.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf-8

  syslog:
    class: logging.handlers.SysLogHandler
    level: WARNING
    formatter: simple
    address: /dev/log
    facility: local0

loggers:
  # Root logger
  root:
    level: INFO
    handlers: [console, file_general, file_errors]

  # Application loggers
  src:
    level: DEBUG
    handlers: [console_detailed, file_general]
    propagate: false

  src.llm_evaluation:
    level: DEBUG
    handlers: [file_llm_api, file_experiments]
    propagate: true

  src.hallucination_detection:
    level: DEBUG
    handlers: [file_hallucination_detection]
    propagate: true

  src.statistical_analysis:
    level: INFO
    handlers: [file_statistical_analysis]
    propagate: true

  src.data_processing:
    level: INFO
    handlers: [file_general]
    propagate: true

  # Third-party library loggers
  openai:
    level: WARNING
    handlers: [file_llm_api]
    propagate: false

  anthropic:
    level: WARNING
    handlers: [file_llm_api]
    propagate: false

  httpx:
    level: WARNING
    handlers: [file_llm_api]
    propagate: false

  urllib3:
    level: WARNING
    handlers: []
    propagate: false

  # Experiment tracking
  mlflow:
    level: INFO
    handlers: [file_experiments]
    propagate: false

  wandb:
    level: INFO
    handlers: [file_experiments]
    propagate: false

# Environment-specific overrides
development:
  handlers:
    console:
      level: DEBUG
  loggers:
    root:
      level: DEBUG

production:
  handlers:
    console:
      level: WARNING
    file_general:
      level: INFO
  loggers:
    root:
      level: INFO
    src:
      level: INFO

testing:
  handlers:
    console:
      level: ERROR
  loggers:
    root:
      level: WARNING
    src:
      level: WARNING
