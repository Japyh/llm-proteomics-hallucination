# Docker Compose configuration for LLM Proteomics Hallucination Research

version: '3.8'

services:
  # Main research environment
  research:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proteomics-hallucination:latest
    container_name: llm-proteomics-research
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./results:/workspace/results
      - ./paper/figures/output:/workspace/paper/figures/output
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true

  # Jupyter notebook server
  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proteomics-hallucination:latest
    container_name: llm-proteomics-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./results:/workspace/results
    environment:
      - PYTHONUNBUFFERED=1
    working_dir: /workspace
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --NotebookApp.password=''

  # LaTeX paper compilation
  latex-compile:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proteomics-hallucination:latest
    container_name: llm-proteomics-latex
    volumes:
      - ./paper:/workspace/paper
    working_dir: /workspace/paper
    command: ./compile.sh

  # Figure generation
  generate-figures:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proteomics-hallucination:latest
    container_name: llm-proteomics-figures
    volumes:
      - ./paper/figures:/workspace/paper/figures
    working_dir: /workspace/paper/figures
    command: python generate_all_figures.py

  # Run tests
  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proteomics-hallucination:latest
    container_name: llm-proteomics-test
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: pytest tests/ -v --cov=src --cov-report=html
