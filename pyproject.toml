[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-proteomics-hallucination"
version = "1.0.0"
description = "Evaluation of hallucinations in LLM responses to proteomics queries"
readme = "README.md"
authors = [
    {name = "Olaf Yunus Laitinen Imanov", email = "olyulaim@dtu.dk"},
    {name = "Derya Umut Kulali", email = "d_u_k@ogr.eskisehir.edu.tr"}
]
maintainers = [
    {name = "Olaf Yunus Laitinen Imanov", email = "olyulaim@dtu.dk"}
]
license = {text = "CC-BY-4.0"}
keywords = [
    "artificial intelligence",
    "large language models",
    "hallucination",
    "proteomics",
    "clinical decision support",
    "machine learning",
    "biomedical informatics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Creative Commons Attribution 4.0 International (CC BY 4.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "pydantic>=2.0.0",
    "jsonschema>=4.17.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tqdm>=4.65.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "pylint>=2.17.0",
    "bandit>=1.7.5"
]
analysis = [
    "statsmodels>=0.14.0",
    "pingouin>=0.5.3",
    "scikit-posthocs>=0.7.0"
]
ml = [
    "mlflow>=2.3.0",
    "wandb>=0.15.0",
    "optuna>=3.2.0"
]
notebooks = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "ipywidgets>=8.0.0",
    "nbconvert>=7.5.0"
]

[project.urls]
Homepage = "https://github.com/olaflaitinen/llm-proteomics-hallucination"
Repository = "https://github.com/olaflaitinen/llm-proteomics-hallucination"
"Bug Reports" = "https://github.com/olaflaitinen/llm-proteomics-hallucination/issues"
Documentation = "https://github.com/olaflaitinen/llm-proteomics-hallucination/blob/main/README.md"
Preregistration = "https://osf.io/x7mk9"
Zenodo = "https://doi.org/10.5281/zenodo.11234567"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88
src_paths = ["src", "tests", "examples"]
skip_gitignore = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --cov=src --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=100"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_api: marks tests that require API credentials"
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.tox/*"
]
branch = true
parallel = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 100.00
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod"
]

[tool.coverage.html]
directory = "htmlcov"
title = "LLM Proteomics Hallucination Test Coverage"

[tool.coverage.xml]
output = "coverage.xml"
