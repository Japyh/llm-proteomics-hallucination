# Project configuration
project_name: llm-proteomics-hallucination
version: 0.1.0

# Paths
data_dir: data/
results_dir: results/
models_dir: models/

# LLM settings
llm:
  default_provider: openai
  default_model: gpt-4
  temperature: 0.7
  max_tokens: 1000

# Analysis settings
analysis:
  random_seed: 42
  test_size: 0.2
  significance_level: 0.05
