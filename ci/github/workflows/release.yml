name: "Release Automation"

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-version:
    name: Validate Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag_name: ${{ steps.get-version.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag or input
        id: get-version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi

          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag_name=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Validate semantic version
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid semantic version: $VERSION"
            exit 1
          fi
          echo "Valid semantic version: $VERSION"

  run-tests:
    name: Run Full Test Suite
    needs: validate-version
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-artifacts:
    name: Build Release Artifacts
    needs: [validate-version, run-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel setuptools

      - name: Update version in package
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          echo "__version__ = '$VERSION'" > src/__version__.py

      - name: Build Python package
        run: |
          python -m build
          echo "Package built successfully!"

      - name: Check distribution
        run: |
          twine check dist/*

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 90

      - name: Build Docker image
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          docker build \
            --tag llm-proteomics-hallucination:$VERSION \
            --tag llm-proteomics-hallucination:latest \
            --file containers/Dockerfile \
            .

          docker save llm-proteomics-hallucination:$VERSION -o docker-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar
          retention-days: 30

  build-manuscript:
    name: Build Publication Manuscript
    needs: validate-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build manuscript PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/manuscript/main.tex
          working_directory: paper/manuscript
          latexmk_use_xelatex: true
          args: -pdf -interaction=nonstopmode

      - name: Build supplementary materials
        uses: xu-cheng/latex-action@v3
        with:
          root_file: paper/supplementary/supplementary.tex
          working_directory: paper/supplementary
          latexmk_use_xelatex: true
          args: -pdf -interaction=nonstopmode

      - name: Rename PDFs with version
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"
          cp paper/manuscript/main.pdf manuscript_v${VERSION}.pdf
          cp paper/supplementary/supplementary.pdf supplementary_v${VERSION}.pdf

      - name: Upload manuscript artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdfs
          path: |
            manuscript_v*.pdf
            supplementary_v*.pdf
          retention-days: 365

  create-release:
    name: Create GitHub Release
    needs: [validate-version, build-artifacts, build-manuscript]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Python package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Download manuscript PDFs
        uses: actions/download-artifact@v4
        with:
          name: manuscript-pdfs
          path: manuscripts/

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.validate-version.outputs.version }}"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            CHANGELOG="Initial release v$VERSION"
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" --no-merges)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate-version.outputs.tag_name }}
          name: Release ${{ needs.validate-version.outputs.tag_name }}
          body: |
            ## Release Notes

            Version ${{ needs.validate-version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Artifacts
            - Python package (wheel and source distribution)
            - Manuscript PDF (The Lancet Digital Health submission)
            - Supplementary materials PDF

            ### Installation
            ```bash
            pip install llm-proteomics-hallucination==${{ needs.validate-version.outputs.version }}
            ```

            ### Citation
            If you use this work, please cite our manuscript (see manuscript PDF).
          files: |
            dist/*
            manuscripts/*.pdf
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: [validate-version, create-release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/llm-proteomics-hallucination

    steps:
      - name: Download Python package artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
          verify-metadata: true

  publish-zenodo:
    name: Create Zenodo Archive
    needs: [validate-version, create-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Zenodo deposit
        run: |
          echo "Create Zenodo DOI for archival and citation"
          echo "Version: ${{ needs.validate-version.outputs.version }}"
          echo "This step would create a Zenodo deposit via API"
          # Actual Zenodo API integration would go here
